spring:
  application:
    name: youth-soccer-scheduler
  # Lets a local .env file (KEY=VALUE lines) supply the variables below without
  # extra tooling. Absent in production, where real environment variables are used.
  config:
    import: optional:file:./.env[.properties]
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 5MB
  thymeleaf:
    cache: true

app:
  # Every CSV timestamp is read as a local time in this zone.
  time-zone: ${APP_TIME_ZONE:America/New_York}
  upload:
    max-bytes-per-file: 1048576
    max-rows-per-file: 2000
  security:
    # No defaults on purpose: start-up fails if these are not supplied.
    username: ${APP_USER:}
    password: ${APP_PASSWORD:}

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
